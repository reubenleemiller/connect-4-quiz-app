name: Ping Supabase keepalive

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Ensure keepalive URL is configured
        run: |
          if [ -z "${{ secrets.SUPABASE_KEEPALIVE_URL }}" ]; then
            echo "Missing SUPABASE_KEEPALIVE_URL secret."
            exit 1
          fi
      - name: Ping Supabase endpoint
        run: |
          curl --fail --silent --show-error --max-time 20 --retry 3 --retry-delay 5 \
            -X POST "${{ secrets.SUPABASE_KEEPALIVE_URL }}"
